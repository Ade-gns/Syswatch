[package]
name = "syswatch-helper"
description = "Service privilégié minimal de SysWatch : pilotage des ventilateurs via D-Bus, autorisé par polkit"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "syswatch-helper"
path = "src/main.rs"

[dependencies]
syswatch-fans = { path = "../syswatch-fans" }
serde.workspace = true
serde_json.workspace = true
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
libc = "0.2"
