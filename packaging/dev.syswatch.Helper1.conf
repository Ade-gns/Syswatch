<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Seul root peut posséder le nom ; tout le monde peut appeler le service,
     qui vérifie lui-même chaque écriture auprès de polkit. -->
<busconfig>
  <policy user="root">
    <allow own="dev.syswatch.Helper1"/>
  </policy>
  <policy context="default">
    <allow send_destination="dev.syswatch.Helper1"/>
  </policy>
</busconfig>
