<!-- @dsCard height=300 -->
<style>
.cv { position: relative; width: 960px; height: 300px; background: var(--bg); overflow: hidden; font-family: var(--font-ui); }
.cv svg { position: absolute; left: 0; top: 0; width: 960px; height: 300px; }
.cv .a { fill: var(--accent); } .cv .w { fill: var(--warn); } .cv .c { fill: var(--crit); } .cv .o { fill: var(--ok); } .cv .d { fill: var(--accent); }
.cv rect.blk { rx: var(--radius-md); }
.cv .tx { position: absolute; left: 40px; bottom: 36px; width: 440px; }
.cv .nm { margin: 0; font: 700 84px/.95 var(--font-ui); letter-spacing: -.02em; color: var(--text); white-space: nowrap; }
.cv .tg { margin: 8px 0 0; font: 400 14px/20px var(--font-ui); color: var(--text-muted); }
</style>
<div class="cv">
<svg viewBox="0 0 960 300" aria-hidden="true">
<!--
blocks: accent 256×192 (bleeds off the top), warn 176×96 (bleeds off the right), crit 80×80, ok 96×140 (bleeds right and bottom) = the four gauge states, accent leading.
arrangement: one tall accent slab left of centre, satellites stepped down to the right edge, gaps of space-4 (16).
pattern: dot grid, a technical/monospace system; dots r=2.2 at space-6 (24) pitch, in the accent colour, 30 units below the slab.
steps and radii: 16 / 24 steps, radius-md (12) on every block.
-->
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="2.2" class="d"/></pattern></defs>
<rect class="blk a" x="528" y="-16" width="256" height="192"/>
<rect class="blk w" x="800" y="48" width="176" height="96"/>
<rect class="blk c" x="800" y="160" width="80" height="80"/>
<rect class="blk o" x="896" y="160" width="96" height="140"/>
<rect x="528" y="200" width="240" height="72" fill="url(#dots)"/>
</svg>
<div class="tx"><h1 class="nm">SysWatch</h1><p class="tg">Surveillance totale du PC, en temps réel.</p></div>
</div>
