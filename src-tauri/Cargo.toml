[package]
name = "syswatch"
description = "SysWatch — surveillance totale du PC"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "syswatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
syswatch-core = { path = "../crates/syswatch-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
tauri-plugin-updater = "2"
time = { version = "0.3", features = ["formatting"] }

# Placement du widget et de l'overlay sous Wayland (protocole layer-shell, pris en charge par KWin).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
